# tmux config — default prefix (C-b) and default keybindings, plus quality-of-life settings.
# Reload after editing: prefix + r

# Terminal & colors: true color through Ghostty, focus events and fast Escape for Neovim
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g focus-events on
set -sg escape-time 10

set -g mouse on
set -g history-limit 50000

# Number windows/panes from 1 to match the keyboard; close gaps when a window exits
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi keys in copy mode (prefix + [)
setw -g mode-keys vi

# Default split/new-window keys, but open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
