[defaults]
inventory = inventory
roles_path = roles
stdout_callback = default
result_format = yaml
# Opt in to ansible-core 2.24 behaviour now: facts only via ansible_facts['...'], never as
# top-level ansible_* variables (stops the INJECT_FACTS_AS_VARS deprecation warning).
inject_facts_as_vars = False
# Every run appends here (timestamped), so Claude can read the user's runs. Directory is created
# by the base role; outside the repo so logs are never committed. Mark secret tasks no_log: true.
log_path = ~/.local/state/ansible/ansible.log

[privilege_escalation]
# Ubuntu 26.04's default sudo is sudo-rs, which rewrites Ansible's password prompt so
# become times out. sudo.ws is the original sudo, still installed alongside it.
become_exe = sudo.ws
