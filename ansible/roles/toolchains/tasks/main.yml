---
- name: Install toolchain packages
  become: true
  ansible.builtin.apt:
    name: "{{ toolchains_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Silences podman-docker's "Emulate Docker CLI using podman" notice on every `docker` call
- name: Mark the docker command as podman
  become: true
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: "0644"

- name: Install Rust {{ rust_toolchain }} toolchain
  ansible.builtin.command: >
    rustup toolchain install {{ rust_toolchain }} --profile default
    --component {{ rust_components | join(',') }}
  register: rustup_install
  changed_when: "' installed - ' in rustup_install.stdout"
  tags: rust

# `rustup default <name>` always reports "set", so compare against the current default first
- name: Read default Rust toolchain
  ansible.builtin.command: rustup default
  register: rustup_current
  changed_when: false
  failed_when: false
  tags: rust

- name: Set default Rust toolchain
  ansible.builtin.command: rustup default {{ rust_toolchain }}
  when: not rustup_current.stdout.startswith(rust_toolchain ~ '-')
  tags: rust

- name: Create ~/.local/opt/downloads
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/opt/downloads"
    state: directory
    mode: "0755"

- name: Download Go {{ go_version }}
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: "{{ home_dir }}/.local/opt/downloads/go{{ go_version }}.tar.gz"
    checksum: "sha256:{{ go_sha256 }}"
    mode: "0644"
  tags: go

# The tarball's top-level directory is go/; rename it per version
- name: Extract Go {{ go_version }}
  ansible.builtin.shell: >
    tar -xzf {{ home_dir }}/.local/opt/downloads/go{{ go_version }}.tar.gz
    -C {{ home_dir }}/.local/opt
    && mv {{ home_dir }}/.local/opt/go {{ home_dir }}/.local/opt/go-{{ go_version }}
  args:
    creates: "{{ home_dir }}/.local/opt/go-{{ go_version }}/bin/go"
  tags: go

- name: Link go and gofmt into ~/.local/bin
  ansible.builtin.file:
    src: "{{ home_dir }}/.local/opt/go-{{ go_version }}/bin/{{ item }}"
    dest: "{{ home_dir }}/.local/bin/{{ item }}"
    state: link
  loop: [go, gofmt]
  tags: go

- name: Create versioned directories for uv and flyctl
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/opt/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "uv-{{ uv_version }}"
    - "flyctl-{{ flyctl_version }}"
  tags: [uv, flyctl]

- name: Download uv {{ uv_version }}
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ home_dir }}/.local/opt/downloads/uv-{{ uv_version }}.tar.gz"
    checksum: "sha256:{{ uv_sha256 }}"
    mode: "0644"
  tags: uv

- name: Extract uv {{ uv_version }}
  ansible.builtin.unarchive:
    src: "{{ home_dir }}/.local/opt/downloads/uv-{{ uv_version }}.tar.gz"
    dest: "{{ home_dir }}/.local/opt/uv-{{ uv_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ home_dir }}/.local/opt/uv-{{ uv_version }}/uv"
  tags: uv

- name: Link uv and uvx into ~/.local/bin
  ansible.builtin.file:
    src: "{{ home_dir }}/.local/opt/uv-{{ uv_version }}/{{ item }}"
    dest: "{{ home_dir }}/.local/bin/{{ item }}"
    state: link
  loop: [uv, uvx]
  tags: uv

- name: Download flyctl {{ flyctl_version }}
  ansible.builtin.get_url:
    url: "https://github.com/superfly/flyctl/releases/download/v{{ flyctl_version }}/flyctl_{{ flyctl_version }}_Linux_x86_64.tar.gz"
    dest: "{{ home_dir }}/.local/opt/downloads/flyctl-{{ flyctl_version }}.tar.gz"
    checksum: "sha256:{{ flyctl_sha256 }}"
    mode: "0644"
  tags: flyctl

- name: Extract flyctl {{ flyctl_version }}
  ansible.builtin.unarchive:
    src: "{{ home_dir }}/.local/opt/downloads/flyctl-{{ flyctl_version }}.tar.gz"
    dest: "{{ home_dir }}/.local/opt/flyctl-{{ flyctl_version }}"
    remote_src: true
    creates: "{{ home_dir }}/.local/opt/flyctl-{{ flyctl_version }}/flyctl"
  tags: flyctl

- name: Link flyctl (and its `fly` alias) into ~/.local/bin
  ansible.builtin.file:
    src: "{{ home_dir }}/.local/opt/flyctl-{{ flyctl_version }}/flyctl"
    dest: "{{ home_dir }}/.local/bin/{{ item }}"
    state: link
  loop: [flyctl, fly]
  tags: flyctl

# Global prefix is ~/.local, set in ~/.npmrc (npm stow package), so no root is needed
- name: Install global npm packages
  community.general.npm:
    name: "{{ item.key }}"
    version: "{{ item.value }}"
    global: true
  loop: "{{ npm_global_packages | dict2items }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ home_dir }}/.local"
  tags: npm

- name: Install cargo packages
  community.general.cargo:
    name: "{{ item.key }}"
    version: "{{ item.value }}"
    locked: true
  loop: "{{ cargo_packages | dict2items }}"
  environment:
    PATH: "{{ home_dir }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  tags: cargo
