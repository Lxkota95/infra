---
# App policy: desktop apps come from apt (Ubuntu or the vendor's repo) or a pinned vendor .deb.
# snapd stays for Ubuntu's own tools (App Center, Firmware Updater, Security Center), but no app snaps.

# Ubuntu's snap wrapper packages (version "1snap1"): never install them from the Ubuntu archive
apps_blocked_snap_wrappers:
  - chromium-browser
  - firefox
  - thunderbird

# Bitwarden desktop: official .deb (no apt repo, so it doesn't auto-update; bump to upgrade).
# Upstream publishes no checksums; sha256 is of the GitHub release asset as downloaded.
bitwarden_version: "2026.10.0"
bitwarden_sha256: fcabfc7da3c327e2625b105e951cee4e60703bb8e256f0aac9cc9bc83ec7063f

# Discord: official .deb (no apt repo). Discord prompts when a newer build exists; bump these to upgrade.
# sha256 is of https://dl.discordapp.net/apps/linux/<version>/discord-<version>.deb as downloaded.
discord_version: "1.0.166"
discord_sha256: fde0bd83d718cd5b9cf949695fb461ae8004da2f3779c429b346dc0659d7de6e

# Obsidian: markdown notes/reader, official .deb (no apt repo). Obsidian updates its app code itself;
# bump these to upgrade the installer/Electron. sha256 matches the GitHub release asset's digest.
obsidian_version: "1.14.5"
obsidian_sha256: c37fb46a966f604823337fb36ab23bd1baf8ce912ec35af59d62358a93357bee

# Snaps replaced by the apt packages above. Removed only after their data is migrated:
# on a machine that still has them, apply with --skip-tags remove-snaps first.
apps_removed_snaps:
  - bitwarden
  - firefox
