---
# Usage (from this directory):  ansible-playbook site.yml -K
# -K prompts for the sudo password; tasks that need root set `become: true`.
- name: Configure workstation
  hosts: workstation
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    # The user's home directory; facts are only read via ansible_facts (see ansible.cfg)
    home_dir: "{{ ansible_facts['env']['HOME'] }}"
  roles:
    - base
    - cli
    - editor
    - toolchains
    - apps
    - security
    - dotfiles
    - backup
    - desktop
    - repos
